<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Tutor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F3F4F6;
            --chat-bg: #FFFFFF;
            --user-msg: #4F46E5;
            --bot-msg: #E5E7EB;
            --text-dark: #1F2937;
            --text-light: #F9FAFB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 20px;
            text-align: center;
        }

        header h2 { font-size: 1.2rem; margin-bottom: 5px; }
        header p { font-size: 0.85rem; opacity: 0.8; }

        /* Contenedor de configuración de API Key integrado en la UI */
        .key-panel {
            background-color: #EEF2FF;
            padding: 10px 15px;
            border-bottom: 1px solid #E0E7FF;
            display: none; /* Se controla con JS */
            gap: 10px;
            align-items: center;
        }

        .key-panel.active { display: flex; }

        .key-panel input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #C7D2FE;
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            display: flex;
        }

        .message .text {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.user { align-self: flex-end; }
        .message.user .text {
            background-color: var(--user-msg);
            color: var(--text-light);
            border-bottom-right-radius: 4px;
        }

        .message.bot { align-self: flex-start; }
        .message.bot .text {
            background-color: var(--bot-msg);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 15px;
            background-color: var(--chat-bg);
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #lang-select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.8rem;
            outline: none;
            background-color: #fff;
            cursor: pointer;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #6B7280;
            cursor: pointer;
            transition: color 0.3s, transform 0.1s;
        }

        .icon-btn:hover { color: var(--primary-color); }
        .icon-btn:active { transform: scale(0.95); }
        .icon-btn.primary { color: var(--primary-color); }

        .recording {
            color: #EF4444 !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <header>
            <h2>🇬🇧 English Tutor</h2>
            <p>Habla en inglés o pide ayuda en español</p>
        </header>

        <div class="key-panel" id="key-panel">
            <input type="password" id="key-input" placeholder="Ingresa tu Azure API Key...">
            <button id="save-key-btn" class="icon-btn primary" title="Guardar Llave"><i class="fas fa-save"></i></button>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <div class="text">Hello! I'm your English tutor. Please ensure your Azure API Key is configured by clicking the key icon below. What would you like to talk about today?</div>
            </div>
        </div>

        <div class="input-area">
            <button id="toggle-key-btn" class="icon-btn" title="Configurar API Key"><i class="fas fa-key"></i></button>
            <select id="lang-select" title="Idioma del Micrófono">
                <option value="en-US">Mic: EN</option>
                <option value="es-ES">Mic: ES</option>
            </select>
            <input type="text" id="user-input" placeholder="Type or speak...">
            <button id="mic-btn" class="icon-btn" title="Hablar / Pausar"><i class="fas fa-microphone"></i></button>
            <button id="send-btn" class="icon-btn primary" title="Enviar"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // =========================================================================
// CONFIGURACIÓN DE ENDPOINTS (Azure AI Foundry)
// =========================================================================
const AZURE_BASE_URL = 'https://loki1-resource.services.ai.azure.com/openai/v1'; 
const DEPLOYMENT_NAME = 'gpt-4.1'; 
const API_URL = AZURE_BASE_URL + '/chat/completions';

// Elementos del DOM
const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const langSelect = document.getElementById('lang-select');

// Elementos del panel de credenciales
const keyPanel = document.getElementById('key-panel');
const keyInput = document.getElementById('key-input');
const saveKeyBtn = document.getElementById('save-key-btn');
const toggleKeyBtn = document.getElementById('toggle-key-btn');

// Estados de control de flujo conversacional
let isConversationActive = false; 
let isBotTalking = false; 
let silenceTimer = null; 
let accumulatedText = ""; // Variable clave: Guardará todo lo que hables pacientemente
const SILENCE_TIMEOUT = 3000; // 3 segundos completos de silencio absoluto para enviar

// Recuperar llave local si existe
let API_KEY = localStorage.getItem('azure_tutor_key');
if (API_KEY) {
    keyInput.value = API_KEY;
} else {
    keyPanel.classList.add('active');
}

// Acciones para la llave
toggleKeyBtn.addEventListener('click', () => {
    keyPanel.classList.toggle('active');
});

saveKeyBtn.addEventListener('click', () => {
    const val = keyInput.value.trim();
    if (val) {
        API_KEY = val;
        localStorage.setItem('azure_tutor_key', API_KEY);
        keyPanel.classList.remove('active');
        appendMessage("🔑 System: API Key guardada correctamente de forma local.", 'bot');
    } else {
        localStorage.removeItem('azure_tutor_key');
        API_KEY = null;
        alert("Llave eliminada.");
    }
});

let chatHistory = [
    {
        role: "system",
        content: "You are an empathetic, friendly, and conversational English tutor. Your main goal is to help me practice my spoken English. Rules: 1. ALWAYS reply in natural and clear English. 2. If I talk or ask something in Spanish because I am stuck or don't know how to say it, kindly translate it or show me the correct way to say it in English, and then continue our conversation in English. 3. Keep your answers short, conversational, and easy to read."
    },
    {
        role: "assistant",
        content: "Hello! I am your English tutor, and I'm very excited to help you practice. Don't worry if you need to use Spanish sometimes, I will help you out. What would you like to talk about today?"
    }
];

// 1. RECONOCIMIENTO DE VOZ CON RE-ENGANCHE SEGURO Y ACUMULADOR
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.interimResults = false; // Solo procesamos resultados definidos para evitar duplicados estorbosos
recognition.continuous = false;    // Dejamos que Chrome corte de forma nativa, pero lo reenganchamos sin enviar

micBtn.addEventListener('click', () => {
    if (!API_KEY) {
        keyPanel.classList.add('active');
        alert("Por favor, guarda primero tu API Key.");
        return;
    }

    if (!isConversationActive) {
        isConversationActive = true;
        accumulatedText = "";
        startListening();
    } else {
        stopConversation();
    }
});

function startListening() {
    if (!isConversationActive || window.speechSynthesis.speaking || isBotTalking) return;
    
    try {
        recognition.lang = langSelect.value; 
        recognition.start();
        micBtn.classList.add('recording');
    } catch (e) {
        console.log("Micrófono reacomodando estados...");
    }
}

function stopConversation() {
    isConversationActive = false;
    isBotTalking = false;
    clearTimeout(silenceTimer);
    accumulatedText = "";
    try { recognition.abort(); } catch(e) {}
    window.speechSynthesis.cancel();
    micBtn.classList.remove('recording');
    userInput.value = "";
}

// CADA VEZ QUE EL NAVEGADOR FORMULA UNA MINIFRASE
recognition.onresult = (event) => {
    // Frenamos cualquier intento previo de envío a Azure
    clearTimeout(silenceTimer);

    const resultText = event.results[0][0].transcript.trim();
    if (resultText.length > 0) {
        // Concatenamos la nueva frase al bloque general que llevas hablando
        accumulatedText += (accumulatedText ? " " : "") + resultText;
        userInput.value = accumulatedText; // Lo vas viendo en pantalla en tiempo real
    }

    // Reiniciamos el cronómetro de 3 segundos. 
    // Solo si pasas 3 segundos exactos sin decir absolutamente nada que el navegador capte, se va a Azure.
    silenceTimer = setTimeout(() => {
        if (isConversationActive && !isBotTalking && accumulatedText.trim().length > 0) {
            console.log("Plazo de silencio cumplido. Enviando párrafo completo...");
            executeSend();
        }
    }, SILENCE_TIMEOUT);
};

recognition.onend = () => {
    // Si el navegador se cortó solo por una pausa tuya, pero NO se ha cumplido el tiempo de silencio,
    // volvemos a encender el micrófono inmediatamente en segundo plano para seguir acumulando.
    if (isConversationActive && !window.speechSynthesis.speaking && !isBotTalking) {
        startListening();
        
        // Mantenemos vivo el temporizador por si esta pausa resulta ser el final de tu intervención
        if (accumulatedText.trim().length > 0 && !silenceTimer) {
            silenceTimer = setTimeout(() => {
                if (isConversationActive && !isBotTalking) {
                    executeSend();
                }
            }, SILENCE_TIMEOUT);
        }
    }
};

recognition.onerror = (event) => {
    if (event.error === 'aborted') return;
    console.error("Notificación del micrófono:", event.error);
    
    if (event.error === 'no-speech' && isConversationActive) {
        startListening();
    }
};

// 2. SÍNTESIS DE VOZ NATIVA
function speakEnglish(text) {
    isBotTalking = true; 
    clearTimeout(silenceTimer);
    micBtn.classList.remove('recording');
    
    try { recognition.abort(); } catch(e) {}
    window.speechSynthesis.cancel();
    
    const speech = new SpeechSynthesisUtterance();
    speech.text = text;
    speech.lang = 'en-US'; 
    speech.volume = 1;
    speech.rate = 0.95; 
    speech.pitch = 1;
    
    const voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) || voices.find(v => v.lang === 'en-US');
    if (englishVoice) speech.voice = englishVoice;

    speech.onend = () => {
        isBotTalking = false; 
        if (isConversationActive) {
            setTimeout(() => { startListening(); }, 400); 
        }
    };

    window.speechSynthesis.speak(speech);
}

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// 3. PROCESAMIENTO Y ENVÍO REFACTORIZADO
function executeSend() {
    try { recognition.abort(); } catch(e) {}
    sendMessage();
}

async function sendMessage() {
    const text = accumulatedText.trim();
    if (!text) return;

    appendMessage(text, 'user');
    userInput.value = '';
    accumulatedText = ""; // Reseteamos el acumulador para el próximo turno
    clearTimeout(silenceTimer);
    silenceTimer = null;

    chatHistory.push({ role: "user", content: text });

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'api-key': API_KEY 
            },
            body: JSON.stringify({ 
                model: DEPLOYMENT_NAME, 
                messages: chatHistory,
                store: true 
            })
        });

        if (!response.ok) {
            const errorData = await response.json();
            appendMessage(`Azure Error: ${errorData.error?.message || "Error en la solicitud."}`, 'bot');
            stopConversation();
            return;
        }

        const data = await response.json();

        if (data.choices && data.choices[0] && data.choices[0].message) {
            const botReply = data.choices[0].message.content;
            appendMessage(botReply, 'bot');
            speakEnglish(botReply); 
            chatHistory.push({ role: "assistant", content: botReply });
        }

    } catch (error) {
        console.error("Error crítico de ejecución:", error);
        appendMessage("Connection issue. Conversation stopped.", 'bot');
        stopConversation();
    }
}

function appendMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.innerHTML = `<div class="text">${text}</div>`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight; 
}

sendBtn.addEventListener('click', () => {
    clearTimeout(silenceTimer);
    executeSend();
});

userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        clearTimeout(silenceTimer);
        executeSend();
    }
});    </script>
</body>
</html>
