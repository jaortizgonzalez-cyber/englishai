<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multivac Voice Agent</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0A0F1D;
            --orbe-idle: rgba(79, 70, 229, 0.4);
            --orbe-listening: rgba(236, 72, 153, 0.6);
            --orbe-thinking: rgba(34, 211, 238, 0.7);
            --orbe-speaking: rgba(168, 85, 247, 0.7);
            --text-glow: #E0E7FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background: radial-gradient(circle at center, #1E1B4B 0%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #F3F4F6;
            overflow: hidden;
        }

        .agent-container {
            width: 100vw;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--text-glow);
            text-shadow: 0 0 15px rgba(199, 210, 254, 0.5);
            margin-bottom: 8px;
        }

        #status-text {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94A3B8;
            transition: all 0.3s ease;
        }

        .orbe-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orbe {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 80%), var(--orbe-idle);
            box-shadow: 0 0 60px 10px rgba(79, 70, 229, 0.3), inset 0 0 30px rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .orbe::before, .orbe::after {
            content: '';
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%;
            border: 2px dashed rgba(168, 85, 247, 0.2);
            animation: rotateRing 12s linear infinite;
            transition: all 0.5s ease;
        }

        .orbe::after {
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            border: 1px solid rgba(34, 211, 238, 0.1);
            animation: rotateRingInverse 20s linear infinite;
        }

        .orbe.listening {
            background-color: var(--orbe-listening);
            box-shadow: 0 0 80px 25px rgba(236, 72, 153, 0.5);
            transform: scale(1.05);
            animation: pulseListening 1.8s ease-in-out infinite;
        }

        .orbe.thinking {
            background-color: var(--orbe-thinking);
            box-shadow: 0 0 90px 30px rgba(34, 211, 238, 0.6);
            transform: scale(0.95);
        }

        .orbe.speaking {
            background-color: var(--orbe-speaking);
            box-shadow: 0 0 100px 35px rgba(168, 85, 247, 0.6);
            animation: waveSpeaking 0.6s ease-in-out infinite alternate;
        }

        .transcript-monitor {
            width: 100%;
            max-width: 480px;
            text-align: center;
            min-height: 60px;
            padding: 10px;
        }

        #realtime-text {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.5;
            color: #CBD5E1;
            font-style: italic;
            opacity: 0.85;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .control-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .control-btn {
            background: none;
            border: none;
            color: #94A3B8;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-btn:hover {
            color: #FFF;
            background: rgba(255, 255, 255, 0.05);
        }

        #activation-btn {
            background: rgba(79, 70, 229, 0.2);
            color: #A5B4FC;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 1.4rem;
            width: 54px;
            height: 54px;
        }

        #activation-btn.active {
            background: rgba(236, 72, 153, 0.2);
            color: #F472B6;
            border-color: rgba(236, 72, 153, 0.4);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
        }

        #lang-select {
            background: transparent;
            color: #94A3B8;
            border: none;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        .key-overlay {
            position: absolute;
            top: 110px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 15px;
            display: none;
            gap: 10px;
            width: 85%;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .key-overlay.active { display: flex; }
        .key-overlay input {
            flex: 1;
            background: #020617;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateRingInverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        
        @keyframes pulseListening {
            0% { box-shadow: 0 0 60px 15px rgba(236, 72, 153, 0.4); }
            50% { box-shadow: 0 0 90px 30px rgba(236, 72, 153, 0.6); }
            100% { box-shadow: 0 0 60px 15px rgba(236, 72, 153, 0.4); }
        }

        @keyframes waveSpeaking {
            0% { transform: scale(1); box-shadow: 0 0 70px 20px rgba(168, 85, 247, 0.5); }
            100% { transform: scale(1.08); box-shadow: 0 0 110px 40px rgba(168, 85, 247, 0.7); }
        }

        /* =========================================================================
     * AJUSTES EXCLUSIVOS DE ILUMINACIÓN PARA EL TELEPROMPTER DE PALABRAS
     * ========================================================================= */
    .transcript-monitor {
        width: 100%;
        max-width: 480px;
        text-align: center;
        min-height: 100px; /* Le damos un poco más de espacio para párrafos largos */
        padding: 15px;
        overflow-y: auto;
    }

    #realtime-text {
        font-size: 1.25rem; /* Un poco más grande para mejor lectura */
        font-weight: 300;
        line-height: 1.6;
        color: #475569; /* Las palabras ocultas o inactivas nacen en un gris oscuro elegante */
        text-shadow: none;
        transition: all 0.2s ease;
    }

    /* Regla para forzar el brillo neón cuando la palabra se activa síncronamente */
    #realtime-text span {
        display: inline-block;
        margin: 0 2px;
        will-change: color, text-shadow, opacity;
    }
    </style>
</head>
<body>

    <div class="agent-container">
        <header>
            <h1>MULTIVAC AI</h1>
            <div id="status-text">Agente Inactivo</div>
        </header>

        <div class="key-overlay" id="key-panel">
            <input type="password" id="key-input" placeholder="Ingresa tu Azure API Key...">
            <button id="save-key-btn" class="control-btn" style="color: #34D399;"><i class="fas fa-save"></i></button>
        </div>

        <div class="orbe-wrapper">
            <div class="orbe" id="orbe-agent" title="Haz clic abajo para iniciar"></div>
        </div>

        <div class="transcript-monitor">
            <p id="realtime-text">Presiona el botón inferior para sincronizar...</p>
        </div>

        <div class="control-bar">
            <button id="toggle-key-btn" class="control-btn" title="Configurar Llave"><i class="fas fa-key"></i></button>
            
            <button id="activation-btn" class="control-btn" title="Iniciar Conversación Manos Libres">
                <i class="fas fa-microphone"></i>
            </button>
            
            <select id="lang-select" title="Idioma del canal">
                <option value="en-US">ANG / EN</option>
                <option value="es-ES">ESP / ES</option>
            </select>
        </div>
    </div>

    <script>
        // =========================================================================
// CONFIGURACIÓN DE ENDPOINTS (Azure AI Foundry)
// =========================================================================
const AZURE_BASE_URL = 'https://loki1-resource.services.ai.azure.com/openai/v1'; 
const DEPLOYMENT_NAME = 'gpt-4.1'; 
const API_URL = AZURE_BASE_URL + '/chat/completions';

// Elementos del DOM mapeados de forma segura
const orbeAgent = document.getElementById('orbe-agent');
const statusText = document.getElementById('status-text');
const realtimeText = document.getElementById('realtime-text');
const activationBtn = document.getElementById('activation-btn');
const langSelect = document.getElementById('lang-select');

const keyPanel = document.getElementById('key-panel');
const keyInput = document.getElementById('key-input');
const saveKeyBtn = document.getElementById('save-key-btn');
const toggleKeyBtn = document.getElementById('toggle-key-btn');

let isConversationActive = false; 
let isBotTalking = false; 
let silenceTimer = null; 
let karaokeTimer = null; // Cronómetro virtual para la iluminación
let accumulatedText = ""; 
const SILENCE_TIMEOUT = 3000; 

// Carga inteligente de API Key corporativa
let API_KEY = localStorage.getItem('azure_tutor_key');
if (API_KEY) {
    keyInput.value = API_KEY;
    if(realtimeText) realtimeText.innerText = "Sincronizado de forma segura. Presiona el micrófono.";
} else {
    if(keyPanel) keyPanel.classList.add('active');
}

if(toggleKeyBtn) {
    toggleKeyBtn.addEventListener('click', () => keyPanel.classList.toggle('active'));
}

if(saveKeyBtn) {
    saveKeyBtn.addEventListener('click', () => {
        const val = keyInput.value.trim();
        if (val) {
            API_KEY = val;
            localStorage.setItem('azure_tutor_key', API_KEY);
            keyPanel.classList.remove('active');
            realtimeText.innerText = "🔑 Conexión establecida. Listo para operar.";
        } else {
            localStorage.removeItem('azure_tutor_key');
            API_KEY = null;
            realtimeText.innerText = "API Key eliminada.";
        }
    });
}

let chatHistory = [
    {
        role: "system",
        content: "You are an empathetic, friendly, and conversational English tutor. Your main goal is to help me practice my spoken English. Rules: 1. ALWAYS reply in natural and clear English. 2. If I talk or ask something in Spanish because I am stuck or don't know how to say it, kindly translate it or show me the correct way to say it in English, and then continue our conversation in English. 3. Keep your answers short, conversational, and easy to read. 4. CRITICAL: Try to avoid complex markdown formatting like excessive bold asterisks or special code blocks in your answers, keep it like regular spoken dialogue."
    },
    {
        role: "assistant",
        content: "Hello! I am your English tutor, and I'm very excited to help you practice. Don't worry if you need to use Spanish sometimes, I will help you out. What would you like to talk about today?"
    }
];

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.interimResults = false; 
recognition.continuous = false;    

if(activationBtn) {
    activationBtn.addEventListener('click', () => {
        if (!API_KEY) {
            keyPanel.classList.add('active');
            alert("Ingresa y guarda tu API Key para poder activar al agente.");
            return;
        }

        if (!isConversationActive) {
            isConversationActive = true;
            activationBtn.classList.add('active');
            accumulatedText = "";
            startListening();
        } else {
            stopConversation();
        }
    });
}

function changeVisualState(state) {
    if (!orbeAgent || !statusText) return;
    orbeAgent.classList.remove('listening', 'thinking', 'speaking');
    
    if (state === 'listening') {
        orbeAgent.classList.add('listening');
        statusText.innerText = "Escuchando...";
        statusText.style.color = "#EC4899";
    } else if (state === 'thinking') {
        orbeAgent.classList.add('thinking');
        statusText.innerText = "Procesando...";
        statusText.style.color = "#22D3EE";
    } else if (state === 'speaking') {
        orbeAgent.classList.add('speaking');
        statusText.innerText = "Hablando...";
        statusText.style.color = "#A855F7";
    } else {
        statusText.innerText = "En Línea / Esperando";
        statusText.style.color = "#94A3B8";
    }
}

function startListening() {
    if (!isConversationActive || window.speechSynthesis.speaking || isBotTalking) return;
    try {
        recognition.lang = langSelect.value; 
        recognition.start();
        changeVisualState('listening');
    } catch (e) {
        console.log("Re-enganchando hardware de micrófono...");
    }
}

function stopConversation() {
    isConversationActive = false;
    isBotTalking = false;
    clearTimeout(silenceTimer);
    clearInterval(karaokeTimer);
    accumulatedText = "";
    if(activationBtn) activationBtn.classList.remove('active');
    try { recognition.abort(); } catch(e) {}
    window.speechSynthesis.cancel();
    changeVisualState('idle');
    if(realtimeText) realtimeText.innerText = "Sistema en pausa.";
}

recognition.onresult = (event) => {
    clearTimeout(silenceTimer);
    const resultText = event.results[0][0].transcript.trim();
    
    if (resultText.length > 0) {
        accumulatedText += (accumulatedText ? " " : "") + resultText;
        if(realtimeText) realtimeText.innerText = `"${accumulatedText}"`; 
    }

    silenceTimer = setTimeout(() => {
        if (isConversationActive && !isBotTalking && accumulatedText.trim().length > 0) {
            executeSend();
        }
    }, SILENCE_TIMEOUT);
};

recognition.onend = () => {
    if (isConversationActive && !window.speechSynthesis.speaking && !isBotTalking) {
        startListening();
        if (accumulatedText.trim().length > 0 && !silenceTimer) {
            silenceTimer = setTimeout(() => {
                if (isConversationActive && !isBotTalking) {
                    executeSend();
                }
            }, SILENCE_TIMEOUT);
        }
    }
};

recognition.onerror = (event) => {
    if (event.error === 'aborted') return;
    if (event.error === 'no-speech' && isConversationActive) {
        startListening();
    }
};

// =========================================================================
// SÍNTESIS DE VOZ CON CRONÓMETRO VIRTUAL (BLINDAJE ANTE BUGS DE CHROME)
// =========================================================================
function speakEnglish(text) {
    isBotTalking = true; 
    clearTimeout(silenceTimer);
    clearInterval(karaokeTimer); // Limpieza preventiva
    changeVisualState('speaking');
    
    try { recognition.abort(); } catch(e) {}
    window.speechSynthesis.cancel();
    
    // 1. Limpieza rigurosa del texto
    let cleanText = text
        .replace(/\*\*/g, '')  
        .replace(/\*/g, '')    
        .replace(/#/g, '')     
        .replace(/`/g, '')     
        .replace(/-\s+/g, '')
        .replace(/\s+/g, ' ')
        .trim(); 

    // 2. Renderizamos las palabras en su estado opaco inicial
    const wordsArray = cleanText.split(' ');
    realtimeText.innerHTML = wordsArray.map((word, index) => {
        return `<span id="wk-${index}" style="transition: all 0.2s ease; color: #475569; opacity: 0.4; display: inline-block; margin: 0 3px;">${word}</span>`;
    }).join(' ');

    const speech = new SpeechSynthesisUtterance();
    speech.text = cleanText; 
    speech.lang = 'en-US'; 
    speech.volume = 1;
    speech.rate = 0.95; 
    
    const voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) || voices.find(v => v.lang === 'en-US');
    if (englishVoice) speech.voice = englishVoice;

    // =========================================================================
    // MOTOR DE TIEMPOS VIRTUAL (KARAOKE GARANTIZADO)
    // =========================================================================
    let currentWordIndex = 0;
    
    // Una velocidad de rate 0.95 equivale a unos 380-400 milisegundos por palabra promedio en inglés
    const MS_PER_WORD = 390; 

    // Iniciamos la animación justo al arrancar la reproducción de voz
    speech.onstart = () => {
        clearInterval(karaokeTimer);
        
        karaokeTimer = setInterval(() => {
            if (currentWordIndex >= wordsArray.length) {
                clearInterval(karaokeTimer);
                return;
            }

            // Apagamos la palabra anterior dejando un rastro atenuado legible
            if (currentWordIndex > 0) {
                const prevEl = document.getElementById(`wk-${currentWordIndex - 1}`);
                if (prevEl) {
                    prevEl.style.color = "#94A3B8";
                    prevEl.style.opacity = "0.7";
                    prevEl.style.textShadow = "none";
                    prevEl.style.transform = "scale(1)";
                }
            }

            // Encendemos la palabra actual con el neón cian radiante
            const currentEl = document.getElementById(`wk-${currentWordIndex}`);
            if (currentEl) {
                currentEl.style.color = "#22D3EE";
                currentEl.style.opacity = "1";
                currentEl.style.textShadow = "0 0 12px #22D3EE, 0 0 4px #22D3EE";
                currentEl.style.transform = "scale(1.08)";
                currentEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            currentWordIndex++;
        }, MS_PER_WORD);
    };

    speech.onend = () => {
        clearInterval(karaokeTimer);
        
        // Al terminar, iluminamos todo el párrafo de forma homogénea para repasar
        const allSpans = realtimeText.querySelectorAll('span');
        allSpans.forEach(span => {
            span.style.color = "#E2E8F0";
            span.style.opacity = "1";
            span.style.textShadow = "none";
            span.style.transform = "scale(1)";
        });

        isBotTalking = false; 
        if (isConversationActive) {
            changeVisualState('listening');
            setTimeout(() => { startListening(); }, 400); 
        } else {
            changeVisualState('idle');
        }
    };

    window.speechSynthesis.speak(speech);
}

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

function executeSend() {
    changeVisualState('thinking');
    try { recognition.abort(); } catch(e) {}
    sendMessage();
}

async function sendMessage() {
    const text = accumulatedText.trim();
    if (!text) return;

    accumulatedText = ""; 
    clearTimeout(silenceTimer);
    silenceTimer = null;

    chatHistory.push({ role: "user", content: text });

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'api-key': API_KEY 
            },
            body: JSON.stringify({ 
                model: DEPLOYMENT_NAME, 
                messages: chatHistory,
                store: true 
            })
        });

        if (!response.ok) {
            const errorData = await response.json();
            if(realtimeText) realtimeText.innerText = `Error: ${errorData.error?.message || "Rechazo corporativo."}`;
            stopConversation();
            return;
        }

        const data = await response.json();

        if (data.choices && data.choices[0] && data.choices[0].message) {
            const botReply = data.choices[0].message.content;
            speakEnglish(botReply); 
            chatHistory.push({ role: "assistant", content: botReply });
        }

    } catch (error) {
        console.error(error);
        if(realtimeText) realtimeText.innerText = "Fallo crítico de conexión externa.";
        stopConversation();
    }
}
    </script>
</body>
</html>
